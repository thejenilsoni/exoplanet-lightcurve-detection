[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exoplanet-detection-api"
version = "0.1.0"
description = "Transit detection and candidate-ranking service for astronomical light curves"
requires-python = ">=3.11"
dependencies = [
  "astropy>=7.1,<8.0",
  "fastapi>=0.116,<1.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.3,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "scipy>=1.16,<2.0",
  "uvicorn[standard]>=0.35,<1.0"
]

[project.optional-dependencies]
ml = ["torch>=2.7,<3.0"]
dev = ["httpx>=0.28,<1.0", "pytest>=8.4,<9.0", "pytest-cov>=6.2,<7.0", "ruff>=0.12,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
